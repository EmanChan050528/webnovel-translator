<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Webnovel Translator — Reader</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 17px/1.7 Georgia, "Songti SC", serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 24px 100px;
      color: #222;
      background: #fdfdfb;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #ddd; background: #1b1b1b; }
    }
    header { margin-bottom: 24px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .chapter-title { font-size: 15px; color: #777; margin: 0 0 16px; }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; font: 13px system-ui, sans-serif; }
    .toolbar button { padding: 6px 12px; cursor: pointer; }
    .toolbar .info { color: #888; margin-left: auto; }
    p.paragraph { margin: 0 0 1.1em; }
    p.paragraph .zh { display: none; color: #888; font-size: 0.92em; margin-bottom: 0.3em; }
    body.show-original p.paragraph .zh { display: block; }
    p.missing { color: #b00020; font-style: italic; }
    .failures { margin-top: 30px; padding: 12px; background: rgba(176,0,32,0.08); border-radius: 6px; font: 13px system-ui, sans-serif; }
    .empty { color: #888; font: 15px system-ui, sans-serif; }
  </style>
</head>
<body>
  <header>
    <h1 id="novelTitle"></h1>
    <p class="chapter-title" id="chapterTitle"></p>
    <div class="toolbar">
      <button id="toggleOriginal">Show original</button>
      <span class="info" id="info"></span>
    </div>
  </header>
  <main id="content"><p class="empty">Loading…</p></main>
</body>
<script src="reader.js" type="module"></script>
</html>
