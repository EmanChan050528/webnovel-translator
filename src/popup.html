<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Webnovel Translator</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 280px; padding: 12px; color: #1a1a1a; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    button { width: 100%; padding: 8px; font-size: 13px; cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.6; }
    #status { margin-top: 10px; font-size: 12px; color: #555; white-space: pre-wrap; }
    #status.error { color: #b00020; }
    label { display: block; margin-top: 10px; font-size: 12px; }
    select, input { width: 100%; margin-top: 4px; padding: 4px; }
  </style>
</head>
<body>
  <h1>Webnovel Translator</h1>
  <label for="model">Model (Ollama)</label>
  <input id="model" value="qwen3.5:9b" />
  <button id="translate">Translate this chapter</button>
  <div id="status"></div>
</body>
<script src="popup.js" type="module"></script>
</html>
