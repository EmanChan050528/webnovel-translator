<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Webnovel Translator</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 340px; padding: 12px; margin: 0; color: #1a1a1a; }
    h1 { font-size: 14px; margin: 0 0 2px; }
    h2 { font-size: 13px; margin: 16px 0 4px; }
    .novel { font-size: 12px; color: #666; margin-bottom: 10px; }
    button { width: 100%; padding: 7px; font-size: 13px; cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.6; }
    button.secondary { margin-top: 6px; }
    label { display: block; margin-bottom: 4px; font-size: 12px; }
    input, select { width: 100%; box-sizing: border-box; padding: 4px; }
    select { margin-bottom: 2px; }
    textarea {
      width: 100%; box-sizing: border-box; height: 220px; resize: vertical;
      font: 12px/1.5 ui-monospace, Consolas, "Microsoft YaHei", monospace; padding: 6px;
    }
    .note { margin-top: 6px; font-size: 12px; color: #555; white-space: pre-wrap; }
    .note.error { color: #b00020; }
    .hint { font-size: 11px; color: #777; margin: 2px 0 6px; white-space: pre-wrap; }
    label.check { display: flex; gap: 6px; align-items: flex-start; margin-top: 10px; font-size: 12px; }
    label.check input { width: auto; margin: 2px 0 0; }
    .row { display: flex; gap: 6px; }
    .row button { flex: 1; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Webnovel Translator</h1>
  <div class="novel" id="novel">Checking this tab…</div>
  <button id="paste" class="secondary">Paste a chapter from any site…</button>

  <section id="chapterTools" hidden>
    <label for="model">Model (Ollama)</label>
    <select id="model"><option>Loading models…</option></select>
    <div class="hint" id="modelNote"></div>
    <button id="translate">Translate this chapter</button>
    <div class="row">
      <button id="stop" class="secondary" hidden>Stop</button>
      <button id="toggle" class="secondary" hidden>Show original</button>
      <button id="retranslate" class="secondary" hidden>Re-translate</button>
      <button id="reader" class="secondary" hidden>Open in reader tab</button>
    </div>
    <div class="note" id="status"></div>
    <div class="hint" id="reapplied"></div>
    <label class="check"><input type="checkbox" id="auto" /> Translate this novel's chapters automatically when I open them</label>

    <h2>Cache</h2>
    <div class="hint" id="cacheStats"></div>
    <button id="clearCache" class="secondary">Clear cached chapters</button>

    <h2>Glossary for this novel</h2>
    <div class="hint">One <code>term = English</code> per line, under a [section]. Existing entries always win over new chapters; a term you delete stays deleted.</div>
    <textarea id="glossary" spellcheck="false"></textarea>
    <button id="saveGlossary" class="secondary">Save glossary</button>
    <div class="note" id="glossaryNote"></div>

    <h2>Testing</h2>
    <button id="export" class="secondary">Export chapter as test fixture</button>
    <div class="note" id="exportNote"></div>
  </section>
</body>
<script src="popup.js" type="module"></script>
</html>
